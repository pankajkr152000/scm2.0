<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">

<head>
    <!-- REQUIRED FOR AJAX -->
    <!-- <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}"> -->
    <title th:text="${loggedInUser.firstName}+' | Contact Page'">Contact Page</title>
</head>

<body>
    <div class="sm:pl-64 pt-16 min-h-[calc(100vh-4rem)] bg-indigo-50 text-gray-950 dark:bg-gray-700 dark:text-gray-50 p-4"
        id="content">
        <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/userSidebar :: user-sidebar}"></div>
        </div>

        <div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
            <div class="flex items-center justify-between flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 p-4">
                <div>
                    <button id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
                        class="inline-flex items-center gap-2 bg-indigo-600 text-white hover:bg-indigo-500
                                        dark:bg-gray-900 dark:text-white dark:hover:bg-gray-600 px-4 py-2 rounded-lg text-sm" type="button">
                        Action
                        <svg class="w-4 h-4 ms-1.5 -me-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                            width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m19 9-7 7-7-7" />
                        </svg>
                    </button>
                    <!-- Dropdown menu -->
                    <div id="dropdown"
                        class="absolute top-full left-0 mt-2 z-50 hidden bg-indigo-100  border border-gray-200 dark:bg-slate-500 rounded-lg shadow-lg w-44">
                        <ul class="p-2 text-sm max-h-60 overflow-y-auto" aria-labelledby="dropdownDefaultButton">
                            <li>
                                <button type="button" onclick="event.preventDefault(); loadContacts('all')"
                                    class="inline-flex items-center w-full p-2 hover:bg-indigo-600 dark:hover:bg-slate-600 hover:bg-neutral-tertiary-medium hover:text-heading rounded">All Deleted 
                                    Contacts</b>
                                </button>
                            </li>
                            <li>
                                <button type="button" onclick="restoreDeletedContacts()"
                                    class="inline-flex  w-full p-2 hover:bg-indigo-600 dark:hover:bg-slate-600 hover:bg-neutral-tertiary-medium hover:text-heading rounded">Restore
                                    Contacts</b>
                                </button>
                            </li>
                            <li>
                                <button type="button" onclick="permanentlyDeleteSelectedContacts()"
                                    class="inline-flex items-center w-full p-2 hover:bg-indigo-600 dark:hover:bg-slate-600 hover:bg-neutral-tertiary-medium hover:text-heading rounded">Delete
                                    Permanently</b>
                                </button>
                            </li>
                            <!-- <li>
                                <button type="button" onclick="deleteSelectedContacts()"
                                    class="inline-flex items-center w-full p-2 hover:bg-indigo-600 dark:hover:bg-slate-600 text-fg-danger hover:bg-neutral-tertiary-medium rounded">Delete</b>
                                </button>
                            </li> -->
                        </ul>
                    </div>
                    <!-- Hidden input (THIS is submitted to Spring) -->
                    <!-- <input type="hidden" id="actionInput"> -->
                </div>
                <label for="search" class="sr-only">Search</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none dark:cursor-pointer dark:bg-slate-500">
                        <i class="fa-solid fa-magnifying-glass fa-bounce "></i>
                    </div>
                    <input type="text" id="search"
                        class="block w-full max-w-96 ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium text-heading text-sm dark:text-black rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                        placeholder="Search">
                </div>
                <!-- Sort By -->
                <select onchange="changeSort(this.value)"
                    class="px-3 py-2 text-sm rounded-base border border-default-medium bg-indigo-50 dark:bg-gray-700">
                    <option value="firstName">Sort: Name</option>
                    <option value="createdAt">Sort: Created Date</option>
                </select>

                <!-- Sort Direction -->
                <select onchange="changeDirection(this.value)"
                    class="px-3 py-2 text-sm rounded-base border border-default-medium bg-indigo-50 dark:bg-gray-700">
                    <option value="ascending">ASC</option>
                    <option value="descending">DESC</option>
                </select>
            </div>
            <table class="w-full text-sm text-left rtl:text-right text-body">
                <thead class="text-sm text-body bg-neutral-secondary-medium border-b border-t border-default-medium">
                    <tr>
                        <th scope="col" class="px-6 py-3 font-medium">
                            Name
                        </th>
                        <th scope="col" class="px-6 py-3 font-medium">
                            Phone
                        </th>
                        <th scope="col" class="px-6 py-3 font-medium">
                            Links
                        </th>
                        <th scope="col" class="px-6 py-3 font-medium">
                            Action
                        </th>
                    </tr>
                </thead>
                <!-- 👇 Contact-list fragment . THIS must match the fragment -->
                <tbody id="contactTableBody" th:replace="~{fragments/contact-list :: list}">
                </tbody>
            </table>
            <!-- Pagination component -->
            <div class="p-5 text-center items-center rounded-lg">
                <nav aria-label="Page navigation example" class="flex items-center justify-center w-full space-x-4">
                    <ul class="flex -space-x-px text-sm">
                        <li th:unless="${contactPage.first}">
                            <a th:href="@{'/user/contacts/allContacts?size='+${pageSize}+'&page='+${contactPage.number-1}}"
                                class="flex items-center justify-center text-body text-black bg-indigo-50 hover:bg-indigo-200 dark:text-white dark:bg-gray-700 dark:hover:bg-gray-500 bg-neutral-secondary-medium border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading shadow-xs font-medium leading-5 rounded-s-lg text-sm px-3 h-9 focus:outline-none">Previous</a>
                        </li>

                        <li class="" th:each="index : ${#numbers.sequence(0,contactPage.totalPages-1)}">
                            <a th:href="@{'/user/contacts/allContacts?size='+${pageSize}+'&page='+${index}}"
                                th:classappend="${index==contactPage.number} ? 'text-blue-600 bg-indigo-100 hover:bg-indigo-200 dark:bg-gray-500 dark:hover:bg-gray-500 dark:text-blue-700 font-bold ' : ' text-black bg-indigo-50 hover:bg-indigo-200 dark:text-white dark:bg-gray-700 dark:hover:bg-gray-500'"
                                aria-current="page"
                                class="flex items-center justify-center text-fg-brand bg-neutral-tertiary-medium box-border border border-default-medium hover:text-fg-brand text-sm w-9 h-9 focus:outline-none font-bold">
                                <span th:text="${index+1}"></span></a>
                        </li>

                        <li th:unless="${contactPage.last}">
                            <a th:href="@{'/user/contacts/allContacts?size='+${pageSize}+'&page='+${contactPage.number+1}}"
                                class="flex items-center justify-center text-body text-black bg-indigo-50 hover:bg-indigo-200 dark:text-white dark:bg-gray-700 dark:hover:bg-gray-500 bg-neutral-secondary-medium border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading shadow-xs font-medium leading-5  rounded-e-lg text-sm px-3 h-9 focus:outline-none">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <th:block th:fragment="script">
        <script>
            document.addEventListener("DOMContentLoaded", function () {

                const dropdownBtn = document.getElementById("dropdownDefaultButton");
                const dropdown = document.getElementById("dropdown");
                const searchInput = document.getElementById("search");
                const tableBody = document.getElementById("contactTableBody");

                if (!dropdownBtn || !dropdown || !searchInput || !tableBody) {
                    console.warn("Contact page JS skipped (required DOM not found)");
                    return;
                }

                window.currentType = "all";
                window.currentPage = 0;
                window.sortBy = "firstName";
                window.sortDirection = "ascending";
                window.searchQuery = "";


                dropdownBtn.addEventListener("click", () => {
                    dropdown.classList.toggle("hidden");
                });

                searchInput.addEventListener("input", function (e) {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        searchQuery = e.target.value.trim();
                        loadContacts(currentType, 0);
                    }, 300);
                });

                // window.loadContacts = function (type, page = 0) {
                //     currentType = type;
                //     currentPage = page;

                //     fetch(`/user/contacts/filter?keyword=${currentType}&page=${currentPage}&sortBy=${sortBy}&sortDirection=${sortDirection}&query=${encodeURIComponent(searchQuery)}`)
                //         .then(res => res.text())
                //         .then(html => {
                //             tableBody.innerHTML = html;
                //         });
                // };
                window.loadContacts = function (type, page = 0) {
                    window.currentType = type;
                    window.currentPage = page;

                    fetch(`/user/contacts/filter?keyword=${window.currentType}&page=${window.currentPage}&sortBy=${window.sortBy}&sortDirection=${window.sortDirection}&query=${encodeURIComponent(window.searchQuery)}`)
                        .then(res => res.text())
                        .then(html => {
                            document.getElementById("contactTableBody").innerHTML = html;
                        });
                };


                window.changeSort = function (value) {
                    sortBy = value;
                    loadContacts(currentType, 0);
                };

                window.changeDirection = function (value) {
                    sortDirection = value;
                    loadContacts(currentType, 0);
                };

                window.showSuccessToast = function (message) {
                    const toast = document.getElementById("toast-success");
                    const msg = document.getElementById("toast-success-message");

                    if (!toast || !msg) return;

                    msg.textContent = message;
                    toast.classList.remove("hidden");
                    toast.style.opacity = "1";

                    // auto hide after 3 seconds
                    setTimeout(() => {
                        toast.style.opacity = "0";
                        setTimeout(() => toast.classList.add("hidden"), 300);
                    }, 3000);
                };

            });
        </script>
    </th:block>
    <th:block th:fragment="script">
        <script>
            window.restoreDeletedContacts = function () {

                const selectedIds = Array.from(
                    document.querySelectorAll(".contact-checkbox:checked")
                ).map(cb => cb.value);

                if (selectedIds.length === 0) {
                    alert("Please select at least one contact to restore");
                    return;
                }

                if (!confirm("Are you sure you want to restore selected contacts?")) {
                    return;
                }

                const headers = { "Content-Type": "application/json" };

                const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
                const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');

                if (csrfTokenMeta && csrfHeaderMeta &&
                    csrfTokenMeta.content && csrfHeaderMeta.content) {
                    headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
                }

                // fetch("/user/contacts/delete", {
                //     method: "POST",
                //     headers,
                //     body: JSON.stringify(selectedIds)
                // })
                // .then(res => {
                //     console.log("DELETE status:", res.status);
                //     // ✅ refresh works now
                //     loadContacts(window.currentType, window.currentPage);
                // })
                // .catch(err => {
                //     console.error("DELETE error:", err);
                //     alert("Delete failed. Check console.");
                // });
                fetch("/user/contacts/restore", {
                    method: "POST",
                    headers,
                    body: JSON.stringify(selectedIds)
                })
                .then(res => {
                    if (!res.ok) {
                        throw new Error("Restore failed with status " + res.status);
                    }

                    // ✅ success toast
                    showSuccessToast("Contacts restored successfully");

                    // refresh table
                    loadContacts(window.currentType, window.currentPage);
                })
                .catch(err => {
                    console.error("Restore error:", err);
                });

            };
        </script>
    </th:block>
    <th:block th:fragment="script">
        <script>
            window.permanentlyDeleteSelectedContacts = function () {

                const selectedIds = Array.from(
                    document.querySelectorAll(".contact-checkbox:checked")
                ).map(cb => cb.value);

                if (selectedIds.length === 0) {
                    alert("Please select at least one contact to delete permanently");
                    return;
                }

                if (!confirm("Are you sure you want to delete permanently selected contacts?")) {
                    return;
                }

                const headers = { "Content-Type": "application/json" };

                const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
                const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');

                if (csrfTokenMeta && csrfHeaderMeta &&
                    csrfTokenMeta.content && csrfHeaderMeta.content) {
                    headers[csrfHeaderMeta.content] = csrfTokenMeta.content;
                }

                // fetch("/user/contacts/delete", {
                //     method: "POST",
                //     headers,
                //     body: JSON.stringify(selectedIds)
                // })
                // .then(res => {
                //     console.log("DELETE status:", res.status);
                //     // ✅ refresh works now
                //     loadContacts(window.currentType, window.currentPage);
                // })
                // .catch(err => {
                //     console.error("DELETE error:", err);
                //     alert("Delete failed. Check console.");
                // });
                fetch("/user/contacts/deletePermanently", {
                    method: "POST",
                    headers,
                    body: JSON.stringify(selectedIds)
                })
                .then(res => {
                    if (!res.ok) {
                        throw new Error("Delete permanently failed with status " + res.status);
                    }

                    // ✅ success toast
                    showSuccessToast("Contacts deleted permanently");

                    // refresh table
                    loadContacts(window.currentType, window.currentPage);
                })
                .catch(err => {
                    console.error("Delete permanently error:", err);
                });

            };
        </script>
    </th:block>

</body>

</html>
