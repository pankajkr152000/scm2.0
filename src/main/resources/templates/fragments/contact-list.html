<tbody th:fragment="list" id="contactTableBody">
    <tr th:each="eachContact : ${contactPage.content}"
        th:object="${eachContact}"
        class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium">

        <td class="w-4 p-4">
            <div class="flex items-center">
                <input type="checkbox"
                       id = "contact-checkbox"
                       class="contact-checkbox w-4 h-4 border border-default-medium rounded-full bg-neutral-secondary-medium accent-blue-500 dark:accent-blue-500"
                       th:value="*{id}">
            </div>
        </td>

        <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">
            <img class="w-10 h-10 rounded-full"
                 th:src="@{*{picture}}"
                 onerror="this.src='/images/avatar-default.png'">

            <div class="ps-3">
                <div class="text-base font-semibold"
                     th:text="*{lastName != null and !#strings.isEmpty(lastName)
                               ? firstName + ' ' + lastName
                               : firstName}">
                </div>
                <div class="font-normal text-body italic" th:text="*{email}"></div>
            </div>
        </th>

        <td class="px-6 py-4">
            <i class="fa-solid fa-phone h-4 w-4"></i>
            <span th:text="*{contactNumber}"></span>
        </td>

        <td class="px-6 py-4">
            <a th:if="*{!#strings.isEmpty(websiteLink)}"
               th:href="*{websiteLink}" target="_blank"
               class="text-blue-600 hover:underline">
                Website&emsp;
            </a>
            
            <a th:if="*{!#strings.isEmpty(linkedInLink)}"
               th:href="*{linkedInLink}" target="_blank"
               class="text-blue-600 hover:underline">
                LinkedIn
            </a>
        </td>

        <td class="px-6 py-4">
            <a href="#" class="font-semibold text-blue-700 hover:underline">
                Edit user
            </a>
        </td>
    </tr>
</tbody>
