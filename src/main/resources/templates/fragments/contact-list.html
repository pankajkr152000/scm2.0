        <tbody>
            <tr th:object="${eachContact}" th:each="eachContact : ${contactPage.getContent()}"
                class="bg-neutral-primary-soft border-b border-default  rounded-lg  hover:bg-neutral-secondary-medium">
                <td class="w-4 p-4">
                    <div class="flex items-center">
                        <input id="table-checkbox-46" type="checkbox" value=""
                            class="w-4 h-4 border border-default-medium rounded-full bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft appearance-auto accent-blue-500">
                        <label for="table-checkbox-46" class="sr-only">Table checkbox</label>
                    </div>
                </td>
                <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">
                    <img class="w-10 h-10 rounded-full" th:src="@{*{picture}}"
                        onerror="this.src='/images/avatar-default.png'" alt="Contact Image">
                    <div class="ps-3">
                        <div class="text-base font-semibold"
                            th:text="*{lastName != null and !#strings.isEmpty(lastName) ? firstName + ' ' + lastName : firstName}">
                            Neil Sims</div>
                        <div class="font-normal text-body italic" th:text="*{email}">
                            neil.sims@flowbite.com
                        </div>
                    </div>
                </th>
                <td class="px-6 py-4">
                    <!-- <i class="fa-solid fa-phone fa-shake h-4 w-4"></i> -->
                    <i class="fa-solid fa-phone h-4 w-4"></i>
                    <span class="font-normal text-body" th:text="*{contactNumber}"></span>
                </td>
                <td class="px-6 py-4">
                    <div class="flex items-center">
                        <a th:if="*{!#strings.isEmpty(websiteLink)}" th:href="*{websiteLink}" target="_blank"
                            class="text-blue-600 hover:underline">
                            Website
                        </a>
                        <div>&emsp;</div>
                        <a th:if="*{!#strings.isEmpty(linkedInLink)}" th:href="*{linkedInLink}" target="_blank"
                            class="text-blue-600 hover:underline">
                            LinkedIn
                        </a>
                    </div>
                </td>
                <td class="px-6 py-4">
                    <a href="#"
                        class="font-semibold text-fg-brand hover:underline text-blue-700 dark:text-blue-500 ">Edit
                        user</a>
                </td>
            </tr>
        </tbody>
    </table>
